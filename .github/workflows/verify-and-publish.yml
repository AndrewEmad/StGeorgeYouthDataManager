name: Verify API and publish both applications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youth-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Start isolated SQL Server
        shell: pwsh
        run: |
          sqllocaldb create YDM_CI
          sqllocaldb start YDM_CI
      - name: Verify API against real SQL Server
        env:
          YDM_TEST_SQL_SERVER: 'Server=(localdb)\YDM_CI;Integrated Security=true'
        run: dotnet test YouthDataManager.slnx --configuration Release --logger "trx;LogFileName=integration.trx" --results-directory artifacts/tests
      - name: Audit backend dependencies with the explicit ImageSharp pin
        shell: pwsh
        run: ./tools/Audit-Dependencies.ps1
      - name: Generate optional schema scripts and publish API
        shell: pwsh
        run: |
          dotnet tool install dotnet-ef --version 8.0.31 --tool-path .tools
          ./.tools/dotnet-ef migrations script 0 20261011115500_MeasuredAttendanceOwnershipIndex --idempotent --project 2.Infrastructure/YouthDataManager.Infrastructure --startup-project 4.WebApis/YouthDataManager.WebApi --output artifacts/schema-additive.sql
          ./.tools/dotnet-ef migrations script 20261011115500_MeasuredAttendanceOwnershipIndex 20261011120000_ReviewedLegacyConstraints --idempotent --project 2.Infrastructure/YouthDataManager.Infrastructure --startup-project 4.WebApis/YouthDataManager.WebApi --output artifacts/schema-reviewed-constraints.sql
          dotnet publish 4.WebApis/YouthDataManager.WebApi --configuration Release --output artifacts/api
      - name: Verify isolated database and photo restoration
        env:
          YDM_RECOVERY_SQL_SERVER: 'Server=(localdb)\YDM_CI;Integrated Security=true'
        run: dotnet run --project tools/YouthDataManager.RecoveryVerification --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-schema-and-test-results
          path: artifacts/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 5.FrontEnd/package-lock.json
      - run: npm ci
        working-directory: 5.FrontEnd
      - run: npm audit --audit-level=low
        working-directory: 5.FrontEnd
      - run: npm run test:utilities
        working-directory: 5.FrontEnd
      - name: Build both clients with enforced 500 kB budgets
        run: npm run build
        working-directory: 5.FrontEnd
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: 5.FrontEnd
      - name: Package both Pages applications together
        run: |
          node e2e/package-pages.mjs YouthDataManager --fixture-api=http://127.0.0.1:4173/__test/api
          npx playwright test --grep-invert "deployed app scopes"
          YDM_E2E_OUTPUT=test-results/pwa npx playwright test pwa.spec.ts --workers 1
          node e2e/package-pages.mjs "${{ github.event.repository.name }}"
        working-directory: 5.FrontEnd
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pages
          path: 5.FrontEnd/pages/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            5.FrontEnd/playwright-report/
            5.FrontEnd/test-results/

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pages
          path: pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment

name: Verify and deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youth-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 5.FrontEnd/package-lock.json
      - run: npm ci
        working-directory: 5.FrontEnd
      - run: npm audit --audit-level=low
        working-directory: 5.FrontEnd
      - run: npm run test:utilities
        working-directory: 5.FrontEnd
      - name: Build both clients with enforced 500 kB budgets
        run: npm run build
        working-directory: 5.FrontEnd
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: 5.FrontEnd
      - name: Package both Pages applications together
        run: |
          node e2e/package-pages.mjs YouthDataManager --fixture-api=http://127.0.0.1:4173/__test/api
          npx playwright test --grep-invert "deployed app scopes"
          YDM_E2E_OUTPUT=test-results/pwa npx playwright test pwa.spec.ts --workers 1
          node e2e/package-pages.mjs "${{ github.event.repository.name }}"
        working-directory: 5.FrontEnd
      - uses: actions/upload-artifact@v4
        with:
          name: verified-pages
          path: 5.FrontEnd/pages/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            5.FrontEnd/playwright-report/
            5.FrontEnd/test-results/

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-pages
          path: pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment

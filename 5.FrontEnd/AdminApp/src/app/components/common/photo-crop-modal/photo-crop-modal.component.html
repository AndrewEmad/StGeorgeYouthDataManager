<app-modal [visible]="visible()" title="قص الصورة" [busy]="cropping()" (close)="onCancel()"><div body>      <div class="crop-area">
        <image-cropper
          #cropper
          [imageFile]="sourceFile() ?? undefined"
          [maintainAspectRatio]="true"
          [aspectRatio]="1"
          [resizeToWidth]="1200"
          [resizeToHeight]="1200"
          format="png"
          output="blob"
          [autoCrop]="true"
          (cropperReady)="ready.set(true)"
          (loadImageFailed)="onLoadFailed()"
        />
      </div>
      @if (cropError()) {
        <p class="text-error" role="alert">{{ cropError() }}</p>
      }
</div><div actions><button type="button" class="btn-outline" (click)="onCancel()" [disabled]="cropping()">إلغاء</button><button type="button" class="btn-primary" (click)="onConfirm()" [disabled]="cropping() || !ready()">{{cropping() ? 'جارٍ القص…' : ready() ? 'تأكيد' : 'جارٍ تحميل الصورة…'}}</button></div></app-modal>

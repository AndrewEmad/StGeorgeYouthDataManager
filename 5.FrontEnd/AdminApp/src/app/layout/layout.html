<div class="app-wrapper">
  <header class="top-bar">
    <div class="top-bar-heading">
      <button
        type="button"
        class="burger-btn layout-nav-btn"
        (click)="toggleSidebar()"
        aria-label="القائمة" [attr.aria-expanded]="sidebarOpen"
      >
        <span class="material-icons" aria-hidden="true">{{ sidebarOpen ? 'close' : 'menu' }}</span>
      </button>
      <h1 class="top-bar-title">{{ pageTitle }}</h1>
    </div>
    <div class="top-bar-left">
      <a routerLink="/dashboard/operations" routerLinkActive="active" class="top-bar-status ydm-icon-button" aria-label="حالة التطبيق" title="حالة التطبيق">
        <span class="material-icons" aria-hidden="true">monitor_heart</span>
      </a>
      <a routerLink="/dashboard/profile" class="top-bar-name link-name" [attr.aria-label]="adminName + '، الملف الشخصي'" [title]="adminName">
        <span class="material-icons" aria-hidden="true">account_circle</span>
        <span class="account-name">{{ adminName }}</span>
      </a>
      <button type="button" class="btn-logout" aria-label="تسجيل الخروج" (click)="logout()">
        <span class="material-icons" aria-hidden="true">logout</span>
      </button>
    </div>
    <ydm-service-year class="global-year-filter"/>
</header>

  <div class="main-layout">
    <aside class="sidebar" [hidden]="mobile">
      <div class="sidebar-header">
        <span class="material-icons brand-icon" aria-hidden="true">hub</span>
        <h2>الإدارة</h2>
      </div>

      <ng-container [ngTemplateOutlet]="navigation"/>
    </aside>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<ng-template #navigation>
  <nav class="side-nav" aria-label="التنقل الرئيسي">
    <a routerLink="/dashboard/stats" routerLinkActive="active"  class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">analytics</span><span>الإحصائيات</span></a>
    <a routerLink="/dashboard/reports" [class.active]="reportsActive" [attr.aria-current]="reportsActive ? 'page' : null" class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">assessment</span><span>التقارير</span></a>
    <a routerLink="/dashboard/attendance" routerLinkActive="active"  class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">event_available</span><span>تسجيل الحضور</span></a>
    <a routerLink="/dashboard/tasks" routerLinkActive="active"  class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">checklist</span><span>متابعة الافتقاد</span></a>
    <a routerLink="/dashboard/students" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">groups</span><span>المخدومين</span></a>
    <a routerLink="/dashboard/servants" routerLinkActive="active"  class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">badge</span><span>الخدام</span></a>
    <a routerLink="/dashboard/requests" routerLinkActive="active"  class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">history</span><span>الطلبات</span></a>
    <a routerLink="/dashboard/activity-history" routerLinkActive="active"  class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">manage_history</span><span>سجل النشاط</span></a>
    <a routerLink="/dashboard/notifications" routerLinkActive="active"  class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">notifications</span><span>الإشعارات</span></a>
    <a routerLink="/dashboard/data-exports" routerLinkActive="active"  class="nav-item" (click)="closeSidebar()"><span class="material-icons" aria-hidden="true">download</span><span>تصدير البيانات</span></a>
  </nav>
</ng-template>
<app-modal [visible]="sidebarOpen && mobile" title="قائمة الإدارة" variant="drawer" (close)="closeSidebar()"><div body><ng-container [ngTemplateOutlet]="navigation"/></div></app-modal>

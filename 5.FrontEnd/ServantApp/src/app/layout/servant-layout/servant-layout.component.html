<header class="layout-header glass-card">
  <div class="header-right">
    @if (!isDashboard) {
      <a routerLink="/dashboard" class="layout-nav-btn btn-back" aria-label="رجوع">
        <span class="material-icons" aria-hidden="true">arrow_forward</span>
      </a>
    }
    <h1 class="page-title">{{ pageTitle }}</h1>
  </div>
  <div class="header-left">
    <a routerLink="/profile" class="profile-link" [attr.aria-label]="servantName + '، الملف الشخصي'" [title]="servantName">
      <span class="material-icons" aria-hidden="true">account_circle</span>
      <span class="profile-name">{{ servantName }}</span>
    </a>
    <a routerLink="/notifications" class="btn-notifications" aria-label="الإشعارات والتذكيرات">
      <span class="material-icons" aria-hidden="true">notifications</span>
    </a>
    <button type="button" class="btn-logout" (click)="logout()" aria-label="تسجيل الخروج">
      <span class="material-icons" aria-hidden="true">logout</span>
    </button>
  </div>
  <ydm-service-year class="global-year-filter"/>
</header>
<main class="layout-content">
  <router-outlet></router-outlet>
</main>

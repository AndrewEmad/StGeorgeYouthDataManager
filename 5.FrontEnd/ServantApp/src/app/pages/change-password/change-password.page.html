<div class="change-password-container">
  <app-card class="login-card animate-fade">
    <div class="login-header">
      <span class="material-icons logo-icon" aria-hidden="true">lock_reset</span>
      <h1>تغيير كلمة المرور</h1>
      <p class="text-muted">يجب تغيير كلمة المرور عند أول دخول</p>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group">
        <label for="ydm-change-password-page-1">كلمة المرور الحالية</label>
        <input id="ydm-change-password-page-1" type="password" [value]="currentPassword()" (input)="currentPassword.set($any($event.target).value)" name="currentPassword" class="form-input" placeholder="كلمة المرور الحالية" required />
      </div>
      <div class="form-group">
        <label for="ydm-change-password-page-2">كلمة المرور الجديدة</label>
        <input id="ydm-change-password-page-2" type="password" [value]="newPassword()" (input)="newPassword.set($any($event.target).value)" name="newPassword" class="form-input" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)" required />
      </div>
      <div class="form-group">
        <label for="ydm-change-password-page-3">تأكيد كلمة المرور الجديدة</label>
        <input id="ydm-change-password-page-3" type="password" [value]="confirmPassword()" (input)="confirmPassword.set($any($event.target).value)" name="confirmPassword" class="form-input" placeholder="تأكيد كلمة المرور" required />
      </div>
      @if (error()) {
        <div class="error-msg">
          <span class="material-icons" aria-hidden="true">error_outline</span>
          {{ error() }}
        </div>
      }
      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (!loading()) { حفظ وتفعيل الحساب }
        @if (loading()) { <span class="spinner"></span> }
      </button>
    </form>
  </app-card>
</div>

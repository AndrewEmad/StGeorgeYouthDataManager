<div class="request-add-student-container">
  <app-card [class]="'form-card animate-fade'">
    <div class="form-header">
      <p class="text-muted">أدخل بيانات المخدوم وستتم مراجعته من الإدارة</p>
    </div>

    <form (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-grid">
        <div class="form-group required">
          <label for="ydm-request-add-student-page-1">الاسم الكامل</label>
          <input id="ydm-request-add-student-page-1" type="text" [(ngModel)]="dto.fullName" name="fullName" class="form-input" placeholder="الاسم الكامل" required />
        </div>
        <div class="form-group required">
          <label for="ydm-request-add-student-page-2">رقم الهاتف</label>
          <input id="ydm-request-add-student-page-2" type="tel" [(ngModel)]="dto.phone" name="phone" class="form-input" placeholder="رقم الهاتف" required />
        </div>
        <div class="form-group">
          <label for="ydm-request-add-student-page-3">هاتف بديل</label>
          <input id="ydm-request-add-student-page-3" type="tel" [(ngModel)]="dto.secondaryPhone" name="secondaryPhone" class="form-input" placeholder="اختياري" />
        </div>
        <div class="form-group">
          <label for="ydm-request-add-student-page-4">النوع</label>
          <select id="ydm-request-add-student-page-4" [(ngModel)]="dto.gender" name="gender" class="form-input">
            @for (g of genderOptions; track g.value) {
              <option [value]="g.value">{{ g.label }}</option>
            }
          </select>
        </div>
        <div class="form-group full-width">
          <label for="ydm-request-add-student-page-5">العنوان</label>
          <input id="ydm-request-add-student-page-5" type="text" [(ngModel)]="dto.address" name="address" class="form-input" placeholder="العنوان" />
        </div>
        <div class="form-group">
          <label for="ydm-request-add-student-page-6">المنطقة</label>
          <select id="ydm-request-add-student-page-6" [(ngModel)]="dto.area" name="area" class="form-input"><option value="">غير مسجلة</option>@for(area of areaChoices;track area){<option [value]="area">{{area}}</option>}</select>
        </div>
        <div class="form-group">
          <label for="ydm-request-add-student-page-7">الكلية</label>
          <input id="ydm-request-add-student-page-7" type="text" [(ngModel)]="dto.college" name="college" class="form-input" placeholder="الكلية" />
        </div>
        <div class="form-group">
          <label for="ydm-request-add-student-page-8">السنة الدراسية</label>
          <select id="ydm-request-add-student-page-8" [(ngModel)]="dto.academicYear" name="academicYear" class="form-input"><option value="">غير مسجلة</option>@for(year of academicYearChoices;track year){<option [value]="year">{{year}}</option>}</select>
        </div>
        <div class="form-group">
          <label for="ydm-request-add-student-page-9">تاريخ الميلاد</label>
          <input id="ydm-request-add-student-page-9" type="date" [(ngModel)]="dto.birthDate" name="birthDate" class="form-input" />
        </div>
        <div class="form-group">
          <label for="ydm-request-add-student-page-10">أب الاعتراف</label>
          <input id="ydm-request-add-student-page-10" type="text" [(ngModel)]="dto.confessionFather" name="confessionFather" class="form-input" placeholder="اختياري" />
        </div>
        <div class="form-group full-width">
          <label for="ydm-request-add-student-page-11">ملاحظات</label>
          <textarea id="ydm-request-add-student-page-11" [(ngModel)]="dto.notes" name="notes" class="form-input" rows="3" placeholder="ملاحظات إضافية"></textarea>
        </div>
      </div>

      @if (error) {
        <div class="error-msg">
          <span class="material-icons" aria-hidden="true">error_outline</span>
          {{ error }}
        </div>
      }

      <div class="form-actions">
        <a routerLink="/students" class="btn-outline">إلغاء</a>
        <button type="submit" class="btn-primary" [disabled]="loading || !dto.fullName.trim() || !dto.phone.trim()">
          @if (!loading) { إرسال الطلب }
          @if (loading) { <span class="spinner"></span> }
        </button>
      </div>
    </form>
  </app-card>
</div>
